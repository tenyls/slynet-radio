# Автопостинг в Телеграм-канал SlyNet Radio:
#  • станция дня (утром и днём), • новости музыки (в обед и вечером), • вопрос подписчикам (воскресенье)
#  • пост об обновлении — сам, когда меняется public/releases.json
name: Телеграм-канал

on:
  schedule:
    # Время UTC; по Берлину летом +2 ч, зимой +1 ч
    - cron: '10 6 * * *'     # 08:10 — станция дня
    - cron: '10 8 * * *'     # 10:10 — новость музыки
    - cron: '10 10 * * *'    # 12:10 — интересная станция
    - cron: '10 12 * * *'    # 14:10 — новость
    - cron: '10 14 * * *'    # 16:10 — интересная станция
    - cron: '10 15 * * 2,5'  # вт и пт 17:10 — напоминание о приложениях
    - cron: '10 16 * * *'    # 18:10 — новость
    - cron: '10 18 * * *'    # 20:10 — интересная станция
    - cron: '40 18 * * 0'    # вс 20:40 — вопрос подписчикам
  push:
    branches: [main]
    paths: ['public/releases.json']
  workflow_dispatch:
    inputs:
      mode:
        description: 'Что опубликовать'
        type: choice
        options: [auto, day, station, news, release, ask, promo, setup]
        default: auto

permissions:
  contents: write

concurrency:
  group: telegram
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Библиотека картинок
        run: npm install --no-save --no-package-lock sharp@0.34.4
      - name: Публикация
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ "${{ github.event_name }}" = "push" ]; then MODE=release; fi
          node scripts/telegram-post.mjs "${MODE:-auto}"
      - name: Запомнить опубликованное
        run: |
          if git diff --quiet -- data/telegram-state.json; then exit 0; fi
          git config user.name "slynet-telegram-bot"
          git config user.email "slynet-telegram-bot@users.noreply.github.com"
          git add data/telegram-state.json
          git commit -m "Телеграм: отметка опубликованного"
          for i in 1 2 3; do git pull --rebase -q origin main && git push && break; sleep 5; done
