# Автопостинг в Телеграм-канал SlyNet Radio:
#  • станция дня (утром и днём), • новости музыки (в обед и вечером), • вопрос подписчикам (воскресенье)
#  • пост об обновлении — запускается вручную (mode=release), не чаще раза в сутки
name: Телеграм-канал

on:
  schedule:
    # Время UTC; по Берлину летом +2 ч, зимой +1 ч. Ночью (с 00 до 07 по Берлину) не публикуем.
    - cron: '5 5 * * *'       # 07:05 — станция дня (со звуком уведомления)
    - cron: '5 6-21 * * *'    # каждый час :05 — интересная станция (тихо)
    - cron: '35 5-21 * * *'   # каждый час :35 — веб-камера «Взгляд на мир» (тихо)
    - cron: '20 8,12,16 * * *' # 10:20, 14:20, 18:20 — новости музыки
    - cron: '50 15 * * 2,5'   # вт и пт 17:50 — напоминание о приложениях
    - cron: '50 18 * * 0'     # вс 20:50 — вопрос подписчикам
  workflow_dispatch:
    inputs:
      mode:
        description: 'Что опубликовать'
        type: choice
        options: [auto, day, station, webcam, news, release, ask, promo, setup]
        default: auto

permissions:
  contents: write

concurrency:
  group: telegram
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Библиотека картинок
        run: npm install --no-save --no-package-lock sharp@0.34.4
      - name: Публикация
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}
          VK_BRIDGE_KEY: ${{ secrets.VK_BRIDGE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          node scripts/telegram-post.mjs "${MODE:-auto}"
      - name: Запомнить опубликованное
        run: |
          if [ -z "$(git status --porcelain data public/rss.xml)" ]; then exit 0; fi
          git config user.name "slynet-telegram-bot"
          git config user.email "slynet-telegram-bot@users.noreply.github.com"
          git add data public/rss.xml
          git commit -m "Телеграм: отметка опубликованного"
          for i in 1 2 3; do git pull --rebase -q origin main && git push && break; sleep 5; done
