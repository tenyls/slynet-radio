name: Поиск разрешений станций
# Робот обходит сайты радиостанций и ищет, разрешают ли они свои потоки в сторонних приложениях.
# Отчёт: docs/STREAM-PERMISSIONS.md (и data/stream-permissions.json). Ничего не блокирует сам.
# Запуск вручную: Actions → «Поиск разрешений станций» → Run workflow. Сам — 1-го числа каждого месяца.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Сколько самых популярных станций проверить'
        default: '3000'
  schedule:
    - cron: '17 3 1 * *'

permissions:
  contents: write

concurrency:
  group: permissions-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Обход сайтов станций
        env:
          LIMIT: ${{ github.event.inputs.limit || '3000' }}
        run: |
          set -o pipefail
          node scripts/permission-scan.mjs 2>&1 | tee /tmp/scan.log
      - name: Сохранить отчёт
        if: always()
        run: |
          tail -n 60 /tmp/scan.log > data/permission-scan.log || true
          git add data/permission-scan.log
          git config user.name "slynet-permissions-bot"
          git config user.email "slynet-permissions-bot@users.noreply.github.com"
          git add data/stream-permissions.json docs/STREAM-PERMISSIONS.md
          git diff --cached --quiet && exit 0
          git commit -m "Отчёт: что станции пишут о своих потоках"
          for i in 1 2 3; do git pull --rebase -q origin main && git push && break; sleep 5; done
