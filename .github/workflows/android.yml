name: Android APK
# Сборка тестового APK для Android. Запуск: Actions → «Android APK» → Run workflow.
# Готовый файл появляется в Releases → «android-latest».
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - run: npx cap add android
      - name: Иконки и заставка
        run: npx --yes @capacitor/assets@3 generate --android --iconBackgroundColor '#09090b' --iconBackgroundColorDark '#09090b' --splashBackgroundColor '#09090b' --splashBackgroundColorDark '#09090b'
      - run: npx cap sync android
      - name: Сборка APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk SlyNetRadio.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SlyNetRadio-apk
          path: SlyNetRadio.apk
      - name: Выложить в Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete android-latest -y --cleanup-tag || true
          gh release create android-latest SlyNetRadio.apk --prerelease \
            --title "SlyNet Radio для Android (тестовая сборка)" \
            --notes "Тестовая сборка из ветки main. Скачайте SlyNetRadio.apk на телефон и установите (разрешите установку из этого источника)."
