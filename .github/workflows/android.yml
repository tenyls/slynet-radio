name: Android APK
# Сборка APK для Android (телефон + Android TV).
# Собирается сам после каждого изменения кода сайта, или вручную: Actions → «Android APK» → Run workflow.
# Готовый файл появляется в Releases → «android-latest».
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'capacitor.config.json'
      - 'assets/**'
      - 'scripts/android-tv-patch.py'
      - '.github/workflows/android.yml'

concurrency:
  group: android-apk
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - run: npx cap add android
      - name: Иконки и заставка
        run: npx --yes @capacitor/assets@3 generate --android --iconBackgroundColor '#09090b' --iconBackgroundColorDark '#09090b' --splashBackgroundColor '#09090b' --splashBackgroundColorDark '#09090b'
      - name: Поддержка Android TV
        run: python3 scripts/android-tv-patch.py
      - run: npx cap sync android
      - name: Сборка APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk SlyNetRadio.apk && cp SlyNetRadio.apk SlyNetRadio-TV.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SlyNetRadio-apk
          path: |
            SlyNetRadio.apk
            SlyNetRadio-TV.apk
      - name: Выложить в Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete android-latest -y --cleanup-tag || true
          gh release create android-latest SlyNetRadio.apk SlyNetRadio-TV.apk --prerelease \
            --title "SlyNet Radio для Android (тестовая сборка)" \
            --notes "build: ${GITHUB_SHA::7} — тестовая сборка из ветки main. SlyNetRadio.apk — для телефонов и планшетов, SlyNetRadio-TV.apk — для Android TV (это одно и то же приложение, оно работает и там, и там)."
