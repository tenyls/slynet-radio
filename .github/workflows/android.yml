name: Android APK
# Сборка APK для Android (телефон + Android TV).
# Собирается сам после каждого изменения кода сайта, или вручную: Actions → «Android APK» → Run workflow.
# Готовый файл появляется в Releases → «android-latest».
on:
  workflow_dispatch:
  push:
    # main — выпуск APK; ветки native-* — только пробная сборка (без выкладки в Releases)
    branches: [main, 'native-*']
    # Только «нативные» изменения. Код сайта приложение получает само (автообновление).
    paths:
      - 'package.json'
      - 'capacitor.config.json'
      - 'assets/**'
      - 'scripts/android-tv-patch.py'
      - 'scripts/android-native-patch.py'
      - 'native/**'
      - '.github/workflows/android.yml'

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Номер сборки (последнее изменение кода, без ежедневного каталога)
        run: echo "BUILD_ID=$(git log -1 --format=%h --abbrev=7 -- src index.html vite.config.ts package-lock.json public/sw.js public/icons public/logo.png public/manifest.webmanifest public/privacy.html)" >> $GITHUB_ENV
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - run: npx cap add android
      - name: Иконки и заставка
        run: npx --yes @capacitor/assets@3 generate --android --iconBackgroundColor '#09090b' --iconBackgroundColorDark '#09090b' --splashBackgroundColor '#09090b' --splashBackgroundColorDark '#09090b'
      - name: Ключ подписи (если добавлен в секреты)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/slynet.jks"
            echo "SLYNET_KEYSTORE=$RUNNER_TEMP/slynet.jks" >> $GITHUB_ENV
            echo "Ключ найден — соберём подписанный APK"
          else
            echo "Ключа нет — соберём отладочный APK"
          fi
      - name: Поддержка Android TV и версия
        env:
          SLYNET_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SLYNET_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: python3 scripts/android-tv-patch.py ${GITHUB_RUN_NUMBER}
      - name: Виджет, будильник, Android Auto
        run: python3 scripts/android-native-patch.py
      - run: npx cap sync android
      - name: Сборка APK
        env:
          SLYNET_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SLYNET_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          cd android && chmod +x gradlew
          if [ -n "$SLYNET_KEYSTORE" ]; then
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../SlyNetRadio.apk
          else
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../SlyNetRadio.apk
          fi
      - run: cp SlyNetRadio.apk SlyNetRadio-TV.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SlyNetRadio-apk
          path: |
            SlyNetRadio.apk
            SlyNetRadio-TV.apk
      - name: Выложить в Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete android-latest -y --cleanup-tag || true
          gh release create android-latest SlyNetRadio.apk SlyNetRadio-TV.apk --prerelease \
            --title "SlyNet Radio для Android (тестовая сборка)" \
            --notes "native: 1.0.${GITHUB_RUN_NUMBER} — тестовая сборка из ветки main. SlyNetRadio.apk — для телефонов и планшетов, SlyNetRadio-TV.apk — для Android TV (это одно и то же приложение, оно работает и там, и там)."
