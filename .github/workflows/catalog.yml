# Ежедневная автопроверка каталога: рабочие станции артистов, серии «один исполнитель»,
# телеканалы и ссылки веб-камер. Нерабочее убирается с сайта автоматически.
# Запустить вручную: вкладка Actions → «Обновить каталог» → Run workflow.
name: Обновить каталог

on:
  schedule:
    - cron: '17 3 * * *' # каждый день в 03:17 UTC (05:17 по Берлину летом)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Проверить источники и собрать catalog.json
        run: node scripts/build-catalog.mjs
      - name: Сохранить изменения
        id: commit
        run: |
          if git diff --quiet -- public/catalog.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Каталог не изменился"
          else
            git config user.name "slynet-catalog-bot"
            git config user.email "slynet-catalog-bot@users.noreply.github.com"
            git add public/catalog.json
            git commit -m "Каталог обновлён автоматически $(date -u +%Y-%m-%d)"
            # Если за время проверки в репозиторий что-то добавили — подтягиваем и пробуем снова
            for i in 1 2 3; do git pull --rebase -q origin main && git push && break; sleep 5; done
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: update
    if: needs.update.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
